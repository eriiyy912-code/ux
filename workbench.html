        <button id="new-project" class="side-control side-create" type="button" disabled data-label="新建项目（仅管理可用）" aria-label="新建项目"><img class="side-icon-img side-icon-create" src="./sidebar-icons/figma-create.svg" alt=""></button>
        <nav class="side-nav" aria-label="页面目录">
          <a class="side-control active" href="#projects" data-label="项目列表" aria-label="项目列表"><img class="side-icon-img side-icon-list" src="./sidebar-icons/figma-list.svg" alt=""></a>
          <a class="side-control" href="#activity" data-label="项目动态" aria-label="项目动态"><img class="side-icon-img side-icon-activity" src="./sidebar-icons/figma-activity.svg" alt=""></a>
          <a class="side-control" href="#module-library" data-label="交互模块库" aria-label="交互模块库"><img class="side-icon-img side-icon-library" src="./sidebar-icons/figma-library.svg" alt=""></a>
        </nav>
        <div class="side-role" aria-label="身份切换">
          <button class="side-control" data-role="admin" data-label="管理：可新建、编辑、发布" type="button" aria-label="管理"><img class="side-icon-img side-icon-role" src="./sidebar-icons/figma-admin.svg" alt=""></button>
          <button class="side-control active" data-role="visitor" data-label="游客：仅查看已发布项目" type="button" aria-label="游客"><img class="side-icon-img side-icon-role" src="./sidebar-icons/figma-visitor.svg" alt=""></button>
        </div>
      </aside>
      <main id="workbench">
        <header class="topbar">
          <div class="title-wrap"><h1>我的工作台</h1></div>
        </header>
        <div id="dashboard" class="workspace">
          <div>
            <section id="projects" class="card project-card" aria-labelledby="projects-title">
              <h2 id="projects-title" class="section-title">项目列表</h2>
              <table class="project-table">
                <thead><tr><th>项目名称</th><th>状态</th><th>发布时间</th><th>来源</th><th>操作</th></tr></thead>
                <tbody>
                  <tr><td><div class="project-name">披哥综艺互动</div></td><td><span class="status">已发布</span></td><td>2025-05-20 14:30</td><td>官方模板</td><td><div class="actions"><button class="view-button canvas-trigger" type="button" data-canvas="./project/ux-pgzy.html" data-canvas-title="披哥综艺互动">查看项目</button><button class="edit-button" type="button" disabled data-canvas="./project/ux-pgzy.html" data-canvas-title="编辑：披哥综艺互动" data-canvas-mode="edit">⌑ 编辑项目</button></div></td></tr>
                </tbody>
              </table>
            </section>
            <section id="activity" class="card activity-card" aria-labelledby="activity-title">
              <h2 id="activity-title" class="section-title">项目动态</h2>
              <div id="activity-list" class="activity-list" aria-live="polite"></div>
            </section>
            <section id="module-library" class="card module-library" aria-labelledby="module-library-title">
              <div class="module-library-head">
                <h2 id="module-library-title" class="section-title">交互模块库</h2>
                <button class="canvas-link canvas-trigger" type="button" data-admin-required="true" data-canvas="./ux-board/ux-board.html" data-canvas-title="交互模板库大画布">打开模板库</button>
              </div>
              <div id="module-grid" class="module-grid" aria-label="模板库模块与页面数量" aria-live="polite"></div>
            </section>
          </div>
        </div>
        <section id="canvas-stage" class="canvas-stage" hidden aria-labelledby="canvas-title">
          <div class="canvas-stage-head">
            <div class="canvas-stage-title"><button id="back-dashboard" class="canvas-back" type="button">← 返回工作台</button><h2 id="canvas-title">交互画布</h2></div>
            <div id="canvas-editor-actions" class="canvas-editor-actions" hidden><button class="page-tool" type="button" data-editor-mode="restore">还原页面</button><button class="page-tool danger" type="button" data-editor-mode="remove">删除页面</button></div>
          </div>
          <div class="canvas-shell"><iframe id="canvas-frame" title="交互画布预览"></iframe></div>
          <aside id="editor-panel" class="editor-panel" hidden aria-labelledby="editor-panel-title">
            <div class="editor-panel-head"><div><h3 id="editor-panel-title">页面配置</h3><p id="editor-panel-note">仅调整当前项目的调用页面，不影响模板库。</p></div><button id="editor-close" class="editor-close" type="button" aria-label="关闭页面配置">×</button></div>
            <div id="editor-page-list" class="editor-page-list"></div>
            <div class="editor-panel-foot"><span id="editor-count" class="editor-count">当前项目 0 个页面</span><button id="editor-apply" class="editor-apply" type="button">确认</button></div>
          </aside>
        </section>
      </main>
    </div>
    <iframe id="module-source" class="module-source" src="./ux-board/ux-board.html" title="模块库数据源" tabindex="-1" aria-hidden="true"></iframe>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      const roleSwitch = document.querySelector('.side-role');
      const newProject = document.getElementById('new-project');
      const editButtons = [...document.querySelectorAll('.edit-button')];
      const toast = document.getElementById('toast');
      const dashboard = document.getElementById('dashboard');
      const canvasStage = document.getElementById('canvas-stage');
      const canvasFrame = document.getElementById('canvas-frame');
      const canvasTitle = document.getElementById('canvas-title');
      const canvasEditorActions = document.getElementById('canvas-editor-actions');
      const editorPanel = document.getElementById('editor-panel');
      const editorTitle = document.getElementById('editor-panel-title');
      const editorNote = document.getElementById('editor-panel-note');
      const editorPageList = document.getElementById('editor-page-list');
      const editorCount = document.getElementById('editor-count');
      const editorApply = document.getElementById('editor-apply');
      const activityList = document.getElementById('activity-list');
      const moduleGrid = document.getElementById('module-grid');
      const moduleSource = document.getElementById('module-source');
      const isLocalWorkbench = window.location.protocol === 'file:';
      const activityStorageKey = 'interaction-workbench-activities-v1';
      const defaultActivities = [
        { text:'已更新「披哥综艺互动」交互与页面配置', time:'2026-07-30 11:16' },
        { text:'已发布「披哥综艺互动」', time:'2025-05-20 14:30' }
      ];
      const moduleDefinitions = [
        { id:'lottery', name:'抽奖', icon:'✦', fallback:9 },
        { id:'tasks', name:'任务', icon:'☷', fallback:8 },
        { id:'my', name:'我的奖品', icon:'♧', fallback:4 },
        { id:'usage', name:'权益使用', icon:'◇', fallback:6 },
        { id:'orders', name:'我的订单', icon:'▤', fallback:3 },
        { id:'transactions', name:'收支明细', icon:'¥', fallback:2 },
        { id:'other', name:'活动规则', icon:'≡', fallback:1 }
      ];
      let projectActivities = readActivities();
      const templatePages = [
        { id:'coupon', module:'抽奖', name:'抽中优惠券', tabs:[['reduce','满减券'],['discount','折扣券'],['single','单品券'],['good','单品好物'],['multi','多券']] },
        { id:'free-card', module:'抽奖', name:'抽中免单卡', tabs:[['category','品类免单卡'],['brand','品牌免单卡'],['star','明星免单卡']] }, { id:'bean', module:'抽奖', name:'抽中京豆' },
        { id:'task-sheet', module:'任务', name:'任务半浮层' }, { id:'task-share', module:'任务', name:'主态 / 分享半浮层' }, { id:'task-login', module:'任务', name:'未登录' },
        { id:'my-prize-sheet', module:'我的奖品', name:'奖品半浮层', tabs:[['cash','免单现金'],['more','更多奖品']] }, { id:'my-prize-empty', module:'我的奖品', name:'奖品空态' },
        { id:'usage-demo', module:'权益使用', name:'主链路交互演示' }, { id:'usage-poster', module:'权益使用', name:'提现健康金成功' },
        { id:'order-sheet', module:'我的订单', name:'订单半浮层', tabs:[['eligible','可参与免单订单'],['waived','已免单订单']] }, { id:'transaction-sheet', module:'收支明细', name:'收支半浮层', tabs:[['all','全部'],['income','收入'],['expense','支出']] }
      ];
      let projectPageIds = new Set(['coupon:reduce', 'coupon:discount', 'coupon:single', 'coupon:good', 'coupon:multi', 'task-sheet', 'my-prize-sheet:cash', 'usage-demo']);
      let currentRole = 'visitor';
      let editorMode = 'restore';
      let toastTimer;

      function readActivities() {
        try {
          const stored = JSON.parse(localStorage.getItem(activityStorageKey));
          if (!Array.isArray(stored) || !stored.length) return [...defaultActivities];
          const missingDefaults = defaultActivities.filter((item) => !stored.some((record) => record.text === item.text));
          return [...stored, ...missingDefaults].sort((a, b) => b.time.localeCompare(a.time));
        } catch (error) {
          return [...defaultActivities];
        }
      }

      function formatActivityTime(date = new Date()) {
        const parts = new Intl.DateTimeFormat('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(date).reduce((result, part) => ({ ...result, [part.type]:part.value }), {});
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
      }

      function renderActivities() {
        activityList.innerHTML = projectActivities.slice(0, 4).map((item) => `<div class="activity"><span class="activity-dot" aria-hidden="true"></span><span class="activity-copy">${item.text}<small>${item.time}</small></span><button class="more canvas-trigger" type="button" data-canvas="./project/ux-pgzy.html" data-canvas-title="披哥综艺互动">查看项目</button></div>`).join('');
      }

      function recordActivity(text) {
        projectActivities = [{ text, time:formatActivityTime() }, ...projectActivities];
        try { localStorage.setItem(activityStorageKey, JSON.stringify(projectActivities)); } catch (error) { /* Private browsing still keeps the current session list. */ }
        renderActivities();
      }

      function countPagesInModule(module) {
        return [...module.querySelectorAll('.template-page')].reduce((total, page) => {
          const tabCount = page.querySelectorAll('[role="tablist"] [role="tab"]').length;
          return total + (tabCount || 1);
        }, 0);
      }

      function renderModuleLibrary(counts = {}) {
        const modules = moduleDefinitions.map((module) => ({ ...module, count:counts[module.id] ?? module.fallback })).filter((module) => module.count > 0);
        moduleGrid.innerHTML = modules.map((module) => `<article class="module-item"><span class="module-icon" aria-hidden="true">${module.icon}</span><span class="module-copy"><b>${module.name}</b><span>${module.count} 个页面</span></span></article>`).join('');
      }

      function syncModuleLibrary() {
        try {
          const sourceDocument = moduleSource.contentDocument;
          if (!sourceDocument?.body) return;
          const counts = Object.fromEntries(moduleDefinitions.map((module) => {
            const sourceModule = sourceDocument.querySelector(`[data-node="${module.id}"]`);
            return [module.id, sourceModule ? countPagesInModule(sourceModule) : 0];
          }));
          renderModuleLibrary(counts);
        } catch (error) {
          renderModuleLibrary();
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function setRole(role) {
        const isAdmin = role === 'admin';
        currentRole = role;
        newProject.disabled = !isAdmin;
        newProject.classList.toggle('is-active', isAdmin);
        editButtons.forEach((button) => { button.disabled = !isAdmin; });
        roleSwitch.querySelectorAll('[data-role]').forEach((option) => option.classList.toggle('active', option.dataset.role === role));
        if (!isAdmin) { canvasEditorActions.hidden = true; editorPanel.hidden = true; }
        showToast(isAdmin ? '已切换为管理身份，可新建和编辑项目。' : '已切换为游客身份，仅可查看已发布项目。');
      }

      if (!isLocalWorkbench) roleSwitch.hidden = true;
      roleSwitch.querySelectorAll('[data-role]').forEach((option) => option.addEventListener('click', () => {
        if (!isLocalWorkbench) return;
        setRole(option.dataset.role);
      }));
      newProject.addEventListener('click', () => showToast('新建项目入口已准备好，可在此接入项目创建流程。'));
      renderActivities();
      renderModuleLibrary();
      moduleSource.addEventListener('load', syncModuleLibrary);
      activityList.addEventListener('click', (event) => {
        const button = event.target.closest('.canvas-trigger');
        if (button) openCanvasTrigger(button);
      });
      editButtons.forEach((button) => button.addEventListener('click', () => showCanvas(button.dataset.canvas, button.dataset.canvasTitle, button.dataset.canvasMode)));
      function showCanvas(source, title, mode = 'view') {
        canvasTitle.textContent = title;
        canvasFrame.src = source;
        dashboard.hidden = true;
        canvasStage.hidden = false;
        canvasEditorActions.hidden = mode !== 'edit';
        editorPanel.hidden = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function openCanvasTrigger(button) {
        if (button.dataset.adminRequired === 'true' && currentRole !== 'admin') {
          showToast('请切换管理模式');
          return;
        }
        showCanvas(button.dataset.canvas, button.dataset.canvasTitle);
      }
      document.querySelectorAll('.canvas-trigger').forEach((button) => button.addEventListener('click', () => openCanvasTrigger(button)));
      document.getElementById('back-dashboard').addEventListener('click', () => {
        canvasFrame.removeAttribute('src');
        canvasStage.hidden = true;
        editorPanel.hidden = true;
        dashboard.hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      document.querySelectorAll('.side-nav a').forEach((link) => link.addEventListener('click', () => {
        if (!canvasStage.hidden) { canvasFrame.removeAttribute('src'); canvasStage.hidden = true; editorPanel.hidden = true; dashboard.hidden = false; }
        document.querySelectorAll('.side-nav a').forEach((item) => item.classList.toggle('active', item === link));
      }));
      function renderEditor() {
        const isRestore = editorMode === 'restore';
        const choiceGroups = templatePages.map((page) => ({
          ...page,
          choices: page.tabs ? page.tabs.map(([tabId, tabName]) => ({ id:`${page.id}:${tabId}`, name:tabName, tab:true })) : [{ id:page.id, name:page.name, tab:false }]
        })).map((page) => ({ ...page, choices:page.choices.filter((choice) => isRestore ? !projectPageIds.has(choice.id) : projectPageIds.has(choice.id)) })).filter((page) => page.choices.length);
        editorTitle.textContent = isRestore ? '还原页面' : '删除页面';
        editorNote.textContent = isRestore ? '可单独选择带二级 Tab 的页面状态，加入当前项目。' : '可单独移除二级 Tab 页面，不影响冻结模板库。';
        editorCount.textContent = `当前项目 ${projectPageIds.size} 个页面`;
        editorApply.textContent = isRestore ? '加入所选页面' : '移除所选页面';
        editorPageList.innerHTML = choiceGroups.length ? choiceGroups.map((page) => page.tabs ? `<section class="editor-group"><div class="editor-group-head"><span>${page.name}</span><small>${page.module} · 二级 Tab</small></div><div class="editor-tab-list">${page.choices.map((choice) => `<label class="editor-page"><input type="checkbox" value="${choice.id}"><span class="editor-page-copy"><b>${choice.name}</b><small>${page.name}</small></span></label>`).join('')}</div></section>` : `<label class="editor-page"><input type="checkbox" value="${page.choices[0].id}"><span class="editor-page-copy"><b>${page.name}</b><small>${page.module}</small></span></label>`).join('') : `<p class="editor-empty">${isRestore ? '模块库页面已全部加入当前项目' : '当前项目暂无可删除页面'}</p>`;
      }
      function openEditor(mode) { editorMode = mode; renderEditor(); editorPanel.hidden = false; }
      document.querySelectorAll('[data-editor-mode]').forEach((button) => button.addEventListener('click', () => openEditor(button.dataset.editorMode)));
      document.getElementById('editor-close').addEventListener('click', () => { editorPanel.hidden = true; });
      editorApply.addEventListener('click', () => {
        const selected = [...editorPageList.querySelectorAll('input:checked')].map((input) => input.value);
        if (!selected.length) { showToast('请先选择页面。'); return; }
        selected.forEach((id) => editorMode === 'restore' ? projectPageIds.add(id) : projectPageIds.delete(id));
        renderEditor();
        recordActivity(editorMode === 'restore' ? `已更新「披哥综艺互动」页面配置，新增 ${selected.length} 个页面` : `已更新「披哥综艺互动」页面配置，移除 ${selected.length} 个页面`);
        showToast(editorMode === 'restore' ? `已加入 ${selected.length} 个页面到当前项目。` : `已从当前项目移除 ${selected.length} 个页面。`);
      });
    </script>
  </body>
</html>
